name: Kunballi PetClinic CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_USERNAME }}/kunballi-petclinic

concurrency:
  group: kunballi-petclinic-deployment
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, test, and publish the image
        run: |
          docker build -f Dockerfile.multi --target production -t "$IMAGE_NAME:sha-$GITHUB_SHA" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PETCLINIC_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: [self-hosted, linux, x64, kunballi]
    timeout-minutes: 15
    permissions: {}
    env:
      APP_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/kunballi-petclinic:sha-${{ github.sha }}

    steps:
      - name: Check the VM deployment folder
        run: |
          command -v curl >/dev/null
          docker info >/dev/null
          cd "$HOME/petclinic-docker"
          test -s .env
          for index in 0 1 2; do
            test -f "redis-$index/redis.conf"
            test -f "sentinel-$index/sentinel.conf"
          done
          docker compose config --quiet
          docker compose config --images | grep -Fx -- "$APP_IMAGE"

      - name: Log in to pull from Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/petclinic-registry
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}

      - name: Deploy the application
        run: |
          cd "$HOME/petclinic-docker"
          umask 077
          docker --config "$RUNNER_TEMP/petclinic-registry" pull "$APP_IMAGE"
          previous_image="$(docker inspect --format '{{.Config.Image}}' petclinic-api 2>/dev/null || true)"
          docker compose up -d --no-build --wait --wait-timeout 240
          curl --fail --silent --show-error http://127.0.0.1:8000/actuator/health >/dev/null
          if [[ -n "$previous_image" && "$previous_image" != "$APP_IMAGE" ]]; then
            printf '%s\n' "$previous_image" > .previous-image
          fi
          printf '%s\n' "$APP_IMAGE" > .deployed-image
          docker compose ps
